name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Test and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.metadata.outputs.version }}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${{ steps.metadata.outputs.created }}" \
            --build-arg SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            -t "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}" \
            -t "${{ steps.metadata.outputs.image }}:latest" \
            -t "${{ steps.metadata.outputs.image }}:${GITHUB_SHA}" .

      - name: Push release image tags
        run: |
          docker push "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}"
          docker push "${{ steps.metadata.outputs.image }}:latest"
          docker push "${{ steps.metadata.outputs.image }}:${GITHUB_SHA}"
